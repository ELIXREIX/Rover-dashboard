<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Mapping Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Rover GPS Mapping</h1>
            <div class="status">
                <div class="status-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16l4-4-4-4M8 12h8"></path>
                    </svg>
                    <span>GPS Active</span>
                </div>
                <div class="status-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25"></path>
                        <path d="M8 16h.01"></path>
                        <path d="M8 20h.01"></path>
                        <path d="M12 18h.01"></path>
                        <path d="M12 22h.01"></path>
                        <path d="M16 16h.01"></path>
                        <path d="M16 20h.01"></path>
                    </svg>
                    <span>Data Collection Active</span>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>Path Analysis</h2>
                <div class="path-metrics">
                    <div class="metric">
                        <div class="metric-label">Displacement</div>
                        <div class="metric-value">2.4 km</div>
                      </div>
                    <div class="metric">
                        <div class="metric-label">Data Points</div>
                        <div class="metric-value" id="data-points-value">0</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Average Speed</div>
                        <div class="metric-value">0.6 m/s</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Active Time</div>
                        <div class="metric-value">0 m</div>
                    </div>
                </div>
                
                <h2>Terrain Classification</h2>
                <div id="selected-point-info">
                    Select a point on the map to see details
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const apiUrl = 'https://2bnjthh3q9.execute-api.ap-southeast-1.amazonaws.com/ManualDeploy/upload-data';

    function updateDataPoints() {
    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            // Log the entire data to the console
            console.log('API Data:', data);

            // Check if 'Items' exists and is an array
            if (data.Items && Array.isArray(data.Items)) {
                const dataPoints = data.Items.length;
                console.log('Data Points:', dataPoints);
                // Update the metric value in the DOM
                document.getElementById('data-points-value').textContent = dataPoints;
            } else {
                console.error('Invalid data structure:', data);
                document.getElementById('data-points-value').textContent = 'Error';
            }
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            document.getElementById('data-points-value').textContent = 'Error';
        });
}

// Call the function when the page loads
window.onload = updateDataPoints;

// Optionally, update data every 6 seconds
setInterval(updateDataPoints, 6000);
</script>
</html>
