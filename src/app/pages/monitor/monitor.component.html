<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Mapping Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Rover GPS Mapping</h1>
            <div class="status">
                <div class="status-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16l4-4-4-4M8 12h8"></path>
                    </svg>
                    <span>GPS Active</span>
                </div>
                <div class="status-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 16.25"></path>
                        <path d="M8 16h.01"></path>
                        <path d="M8 20h.01"></path>
                        <path d="M12 18h.01"></path>
                        <path d="M12 22h.01"></path>
                        <path d="M16 16h.01"></path>
                        <path d="M16 20h.01"></path>
                    </svg>
                    <span>Data Collection Active</span>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>Path Analysis</h2>
                <div class="path-metrics">
                    <div class="metric">
                        <div class="metric-label">Distance Covered</div>
                        <div class="metric-value">2.4 km</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Data Points</div>
                        <div class="metric-value">127</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Average Speed</div>
                        <div class="metric-value">1.2 m/s</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Active Time</div>
                        <div class="metric-value">2h 15m</div>
                    </div>
                </div>
                
                <h2>Terrain Classification</h2>
                <div id="selected-point-info">
                    Select a point on the map to see details
                </div>
            </div>
        </div>
    </div>
</body>
</html>
