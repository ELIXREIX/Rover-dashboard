version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18.19.0
        - nvm use 18.19.0
        - node -v
        - npm cache clean --force
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/my-ngzorro-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*