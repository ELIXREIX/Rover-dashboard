version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Set Node.js version
        - nvm install 18.19.0
        - nvm use 18.19.0
        - node -v
        # Clean and prepare
        - rm -rf node_modules
        - npm cache clean --force
        # Install dependencies
        - npm install --legacy-peer-deps
        - npm install @ctrl/tinycolor --save
        - npm install @rollup/plugin-node-resolve --save-dev
    build:
      commands:
        - echo "Building Angular app..."
        - npm run build
  artifacts:
    baseDirectory: dist/my-ngzorro-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*