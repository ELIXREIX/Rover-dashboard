version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm cache clean --force
        - npm ci --legacy-peer-deps
        - npm install @ctrl/tinycolor --save
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/my-ngzorro-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*